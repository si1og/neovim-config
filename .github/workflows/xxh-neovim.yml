name: Build xxh Neovim

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xxh-neovim.yml"
      - "haskell/**"
      - "lua/**"
      - "init.lua"
      - "lazy-lock.json"
      - "scripts/xxh/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xxh-neovim-release
  cancel-in-progress: true

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            nvim_arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            nvim_arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          enable-stack: true
          stack-version: latest
          stack-no-global: true

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            haskell/.stack-work
          key: ${{ runner.os }}-${{ matrix.arch }}-stack-${{ hashFiles('haskell/stack.yaml', 'haskell/nvim-config-hs.cabal') }}

      - name: Build and test Haskell provider
        working-directory: haskell
        run: |
          mkdir -p ../dist/provider
          stack --no-terminal test
          stack --no-terminal build nvim-config-hs:exe:nvim-config-hs \
            --copy-bins --local-bin-path ../dist/provider
          file ../dist/provider/nvim-config-hs
          ldd ../dist/provider/nvim-config-hs

      - name: Assemble portable payload
        run: |
          payload="$RUNNER_TEMP/xxh-neovim"
          mkdir -p "$payload/bin" "$payload/config" "$payload/lib" "$payload/opt"

          nvim_archive="nvim-linux-${{ matrix.nvim_arch }}.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/neovim/neovim/releases/download/stable/$nvim_archive" \
            | tar -xz -C "$payload/opt"
          mv "$payload/opt/nvim-linux-${{ matrix.nvim_arch }}" "$payload/opt/nvim"

          cp dist/provider/nvim-config-hs "$payload/bin/nvim-config-hs"
          ldd dist/provider/nvim-config-hs \
            | awk '/=> \/.*\/(libgmp|libtinfo|libnuma|libffi)/ { print $3 }' \
            | while read -r library; do cp --dereference "$library" "$payload/lib/"; done
          cp scripts/xxh/nvim-wrapper.sh "$payload/bin/nvim"
          chmod +x "$payload/bin/nvim" "$payload/bin/nvim-config-hs"

          mkdir -p "$payload/config/nvim"
          git archive HEAD | tar -x -C "$payload/config/nvim"
          git -C "$payload/config/nvim" init
          git -C "$payload/config/nvim" config user.name "xxh build"
          git -C "$payload/config/nvim" config user.email "xxh-build@localhost"
          git -C "$payload/config/nvim" add .
          git -C "$payload/config/nvim" commit -m "xxh payload"

          tar -czf "xxh-neovim-linux-${{ matrix.arch }}.tar.gz" -C "$payload" .

      - name: Upload payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xxh-neovim-linux-${{ matrix.arch }}
          path: xxh-neovim-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download payload artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: xxh-neovim-linux-*
          path: dist
          merge-multiple: true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view xxh-latest >/dev/null 2>&1; then
            gh release create xxh-latest \
              --title "xxh Neovim" \
              --notes "Rolling Linux x86_64 and aarch64 builds for the xxh prerun plugin."
          fi
          gh release upload xxh-latest dist/*.tar.gz --clobber
